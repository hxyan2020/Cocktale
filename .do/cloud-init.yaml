#cloud-config
package_update: true
packages:
  - git
  - curl
  - nginx
  - ufw

runcmd:
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  - npm install -g pm2
  - mkdir -p /var/www
  - git clone https://github.com/hxyan2020/Cocktale.git /var/www/cocktale
  - cd /var/www/cocktale && npm ci
  - cd /var/www/cocktale && npm run build
  - cd /var/www/cocktale && pm2 start npm --name cocktale -- start
  - pm2 save
  - pm2 startup systemd -u root --hp /root | tail -n 1 | bash
  - |
    cat >/etc/nginx/sites-available/cocktale <<'EOF'
    server {
      listen 80 default_server;
      listen [::]:80 default_server;
      server_name _;
      location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
      }
    }
    EOF
  - ln -sf /etc/nginx/sites-available/cocktale /etc/nginx/sites-enabled/cocktale
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t && systemctl restart nginx
  - ufw allow OpenSSH
  - ufw allow 'Nginx Full'
  - ufw --force enable
