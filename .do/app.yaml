name: cocktale
region: nyc
services:
  - name: web
    github:
      repo: hxyan2020/Cocktale
      branch: master
      deploy_on_push: true
    source_dir: /
    build_command: npm ci && npm run build
    run_command: npm run start
    environment_slug: node-js
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
